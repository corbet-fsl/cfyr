name: ci
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: &id001
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Check the committed dependency graph before refresh
      run: python3 .github/check-first-party.py
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        cargo update --manifest-path tests/browser/Cargo.toml

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock tests/browser/Cargo.lock >> resolver.txt

        '
    - uses: actions/upload-artifact@v7
      with:
        name: resolved-lock
        path: 'Cargo.lock

          tests/browser/Cargo.lock

          resolver.txt

          '
        retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: &id002
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        workspaces: '. -> target

          tests/browser -> target

          '
    - run: rustc --version
    - name: Import the exact resolved owner's real test server
      run: 'cargo metadata --locked --format-version 1 > dependency-metadata.json

        python3 .github/copy-owner-tests.py

        '
    - run: 'cargo fmt --all --check

        cargo fmt --manifest-path tests/browser/Cargo.toml --all --check'
    - run: cargo clippy --locked --all-features --all-targets -- -D warnings
    - run: cargo test --locked --all-features
    - name: Build the real browser fixture with the already checked native graph
      run: "cargo build --locked --features http --example browser-fixture --message-format=json > browser-native-build.json\n\
        python3 - <<'PYCODE'\nimport json, shutil\nfrom pathlib import Path\ncandidates = [row['executable']\
        \ for line in Path('browser-native-build.json').read_text().splitlines()\n              if (row\
        \ := json.loads(line)).get('reason') == 'compiler-artifact'\n              and row.get('target',\
        \ {}).get('name') == 'browser-fixture' and row.get('executable')]\nassert len(candidates) == 1\n\
        Path('browser-native').mkdir()\nshutil.copy2(candidates[0], 'browser-native/browser-fixture')\n\
        shutil.copy2('browser-native-build.json', 'browser-native/build.json')\nshutil.copy2('Cargo.lock',\
        \ 'browser-native/Cargo.lock')\nPYCODE\n"
    - uses: actions/upload-artifact@v7
      with:
        name: browser-native
        path: browser-native/
        retention-days: 7
    - run: 'cargo metadata --manifest-path tests/browser/Cargo.toml --locked --format-version 1 > browser-dependency-metadata.json

        python3 .github/check-browser-graph.py

        cargo clippy --manifest-path tests/browser/Cargo.toml --locked --all-targets --target wasm32-unknown-unknown
        -- -D warnings

        '
      name: Check the actual browser consumer graph
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: owner-test-input
        path: 'Cargo.lock

          dependency-metadata.json

          owner-fixture.json

          '
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        cargo fmt --manifest-path tests/browser/Cargo.toml --all

        git diff --binary > formatting.patch

        '
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-check
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - run: 'python3 .github/check-first-party.py

        python3 .github/test-source-coverage.py

        node --test .github/test-auto-merge.mjs'
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    - run: cargo deny --manifest-path tests/browser/Cargo.toml --locked check advisories
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        cargo fmt --manifest-path tests/browser/Cargo.toml --all

        git diff --binary > formatting.patch

        '
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-dependency-policy
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
    - check
    - dependency-policy
    - resolve
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
        cache-on-failure: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Import the same owner's real test server
      run: 'cargo metadata --locked --format-version 1 > dependency-metadata.json

        python3 .github/copy-owner-tests.py

        '
    - name: Measure real round trips and failure paths
      run: 'rustc --version

        cargo llvm-cov --version

        cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex ''(/tests/|/tests\.rs$)'' --json --output-path coverage.json'
    - name: Export source counters from the same execution
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '(/tests/|/tests\.rs$)' --lcov
        --output-path coverage.lcov
    - name: Export independent source locations from the same execution
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '(/tests/|/tests\.rs$)' --text
        --output-path coverage.txt
    - name: Require every emitted source line and branch
      run: 'python3 .github/check-coverage.py coverage.json || true

        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: 'coverage.lcov

          coverage.json

          Cargo.lock

          resolver.txt

          coverage.txt'
        retention-days: 7
  wasm-coverage:
    needs:
    - check
    - dependency-policy
    - resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -Zno-profiler-runtime -Clink-args=--no-gc-sections
        --cfg=owned_browser_coverage
      WASM_BINDGEN_TEST_ONLY_WEB: '1'
      WASM_BINDGEN_SPLIT_LINKED_MODULES: '1'
      CHROMEDRIVER: /usr/bin/chromedriver
      CC_wasm32_unknown_unknown: clang
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - name: Use an absolute test runner path for the consumer workspace
      run: echo "CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=python3 $GITHUB_WORKSPACE/.github/browser-coverage-runner.py"
        >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@nightly
      with:
        targets: wasm32-unknown-unknown
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        key: browser-coverage
        cache-on-failure: true
        workspaces: tests/browser -> target
    - id: binding-version
      run: "python3 - <<'PYCODE'\nimport os, tomllib\npackages = tomllib.load(open('tests/browser/Cargo.lock',\
        \ 'rb'))['package']\nversions = [p['version'] for p in packages if p['name'] == 'wasm-bindgen']\n\
        assert len(versions) == 1\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('version='\
        \ + versions[0] + '\\n')\nPYCODE\n"
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov,wasm-bindgen-cli@${{ steps.binding-version.outputs.version }}
    - name: Install browser and ephemeral TLS fixture tools
      run: "python3 -m pip install -r .github/requirements.txt\nsudo apt-get update -qq\nsudo apt-get\
        \ install -y caddy libcap2-bin\nsudo systemctl stop caddy || true\nsudo setcap cap_net_bind_service=+ep\
        \ \"$(command -v caddy)\"\nmkdir -m 700 .browser-tls\nopenssl req -x509 -newkey rsa:2048 -nodes\
        \ -days 1 -subj /CN=wallet.example.test \\\n  -addext subjectAltName=DNS:wallet.example.test,DNS:alpha.example.test,DNS:vault.alpha.example.test,DNS:api.alpha.example.test \\\
        \n  -keyout .browser-tls/key.pem -out .browser-tls/cert.pem 2>/dev/null\n"
    - uses: actions/download-artifact@v8
      with:
        name: browser-native
        path: browser-native
    - name: Check the native fixture used this run's server dependency snapshot
      run: 'cmp Cargo.lock browser-native/Cargo.lock

        chmod +x browser-native/browser-fixture

        '
    - name: Exercise the browser through real TLS and the real door
      run: "set -euo pipefail\nbrowser-native/browser-fixture browser-fixture.json &\nfixture_pid=$!\n\
        trap 'kill \"$fixture_pid\" 2>/dev/null || true' EXIT\nfor attempt in $(seq 1 120); do\n  test\
        \ -s browser-fixture.json && break\n  kill -0 \"$fixture_pid\"\n  sleep 1\ndone\ntest -s browser-fixture.json\n\
        cargo llvm-cov test --manifest-path tests/browser/Cargo.toml --locked --dep-coverage cfyr --test\
        \ browser_client --test trust_browser \\\n  --branch --coverage-target-only --target wasm32-unknown-unknown --json\
        \ --output-path wasm-coverage.json \\\n  --ignore-filename-regex '(/tests/|/\\.github/coverage-runtime/)'\n"
    - name: Export browser source counters from the same execution
      if: always()
      run: cargo llvm-cov report --manifest-path tests/browser/Cargo.toml --locked --dep-coverage cfyr
        --target wasm32-unknown-unknown --lcov --output-path wasm-coverage.lcov --ignore-filename-regex
        '(/tests/|/\.github/coverage-runtime/)'
    - name: Export independent browser source locations
      if: always()
      run: cargo llvm-cov report --manifest-path tests/browser/Cargo.toml --locked --dep-coverage cfyr
        --target wasm32-unknown-unknown --text --output-path wasm-coverage.txt --ignore-filename-regex
        '(/tests/|/\.github/coverage-runtime/)'
    - name: Require every actual browser source line and branch
      run: python3 .github/check-source-coverage.py wasm-coverage.lcov wasm-coverage.json wasm-coverage.txt
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: wasm-coverage
        path: 'wasm-coverage.lcov

          wasm-coverage.json

          wasm-coverage.txt

          Cargo.lock

          tests/browser/Cargo.lock

          resolver.txt

          browser-native/build.json

          '
'on':
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  CARGO_HTTP_USER_AGENT: dependency-ci
