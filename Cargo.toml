[package]
name = "cfyr"
autotests = false
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Foyer: device forwarding to the owner-generated cvld door contract"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/cfyr.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[features]
default = ["http"]
http = ["cvld-client/client-http", "cnvy/http"]
browser = ["cvld-client/client-browser", "cnvy/browser"]
ohttp = ["cvld-client/client-ohttp"]
# Test only: print the kind of a flattened cause on stderr (`cause: <file>:<line>
# <what> -> <ErrorKind>`). The e2e device build enables it through the embedding cmsg
# build; production builds never enable it.
development-gate = []

[dependencies]
cvld-client = { git = "https://git.corbet.ch/corbet-fsl/cvld.git", branch = "main", default-features = false, features = ["client"] }
# The original tagged account request: a read-only send admits exactly its Status variant.
cblc = { git = "https://git.corbet.ch/corbet-fsl/cblc.git", branch = "main", default-features = false }
cnvy = { git = "https://git.corbet.ch/corbet-libre/cnvy.git", branch = "main", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main" }
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch.git", branch = "main" }
# The bind nonce.
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
url = "2"
cpky = { git = "https://git.corbet.ch/corbet-libre/cpky.git", branch = "main", features = ["test-authenticator"] }
cvld = { git = "https://git.corbet.ch/corbet-fsl/cvld.git", branch = "main", default-features = false, features = ["development-gate", "client-http"] }
cmty = { git = "https://git.corbet.ch/corbet-fsl/cmty.git", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-libre/cpsd.git", branch = "main", default-features = false, features = ["storage"] }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", features = ["libsql"] }
cgbl = { git = "https://git.corbet.ch/corbet-fsl/cgbl.git", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main" }
crgs = { git = "https://git.corbet.ch/corbet-libre/crgs.git", branch = "main" }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
cpns = { git = "https://git.corbet.ch/corbet-libre/cpns.git", branch = "main" }
ed25519-dalek = { version = "2.2" }
axum = { version = "0.8.9" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
passkey = { version = "0.6", features = ["rust-crypto"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["crypto"] }
# A real Keys `Created` receipt and its genesis stamp evidence for device-key members.
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main" }
blake3 = "1"

# The integration tests are listed explicitly because the browser fixture is an example, not a test:
# `tests/browser-fixture.rs` is built and run by CI (`cargo build --example browser-fixture`, .github/workflows/ci.yml).
# With automatic test discovery it was also a test target, so `--all-targets` compiled and linked it twice.
[[test]]
name = "it"
path = "tests/it/main.rs"

[[example]]
name = "browser-fixture"
path = "tests/browser-fixture.rs"
required-features = ["http"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
