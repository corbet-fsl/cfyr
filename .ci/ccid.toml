schema = 1
project = "cfyr"

[checks.rust]
kind = "commands"
commands = [
  ["rustc", "--version"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[render]
tool_revision = "2db9dddd5e43d48b6cdbb2728818957db65acf5e"
tool_sha256 = "f5a672c714ca91a87e230713086379f06ad6df6d0ccd9112ee5fbf0cd44f95e7"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["rust"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
