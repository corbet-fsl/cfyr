schema = 1
project = "cfyr"
repository = "https://git.corbet.ch/corbet-libs/cfyr.git"

[checks.rust]
kind = "commands"
commands = [
  ["rustc", "--version"],
  ["bash", ".ci/import-owner-tests.sh"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"]]
cache_outputs = ["dependency-metadata.json", "owner-fixture.json"]

# Direct product qualification with the same genuine resolved owner fixture.
# Full cached Rust/Wasm verification remains a separate unchanged gate.
[checks.native]
kind = "commands"
commands = [
  ["rustc", "--version"],
  ["bash", ".ci/import-owner-tests.sh"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "test", "--locked", "--lib"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"]]
cache_outputs = ["dependency-metadata.json", "owner-fixture.json"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
# The pinned renderer predates cache=false; the runner uses direct uncached check.
cache_outputs = ["Cargo.lock", "tests/browser/Cargo.lock"]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["rust"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[jobs.native]
scheduler = "crow"
checks = ["native"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cfyr"

# Retain the reviewed integration graph before a separate locked verification.
[jobs.resolve-dependencies]
scheduler = "crow"
checks = ["resolve-dependencies"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
