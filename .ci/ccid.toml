schema = 1
project = "cfyr"

[checks.rust]
kind = "commands"
commands = [
  ["rustc", "--version"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["rust"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[check_shell]
