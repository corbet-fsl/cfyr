schema = 1
project = "cfyr"
repository = "https://git.corbet.ch/corbet-libs/cfyr.git"

[checks.rust]
kind = "commands"
commands = [
  ["rustc", "--version"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["rust"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cfyr"
