schema = 1
project = "cfyr"

[checks.rust]
kind = "commands"
commands = [
  ["rustc", "--version"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[render]
tool_revision = "bd9aff07073185fb0a3503bab331aedefb6d8fd2"
tool_sha256 = "38c0eadf2a2adb406f83c7d4892bc01a0a10b95671e1e671358e43a257bb5d23"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["rust"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
